<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Dither Patterns for Magma Alert Ocean -->
    <pattern id="dither-1" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#991b1b" />
      <rect x="2" y="2" width="2" height="2" fill="#991b1b" />
    </pattern>
    <pattern id="dither-2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#450a0a" />
      <rect x="2" y="2" width="2" height="2" fill="#450a0a" />
    </pattern>
  </defs>

  <style><![CDATA[
    /* Chiptune Typography */
    .px-text { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #fca5a5; letter-spacing: 1px; }
    .px-title { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #ef4444; letter-spacing: 1.5px; }
    .px-sub { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: bold; font-size: 9px; fill: #f87171; }
    .px-yellow { fill: #facc15; }
    .px-red { fill: #ef4444; }
    .px-white { fill: #ffffff; }

    /* Pixel Frame-by-Frame Keyframes */
    @keyframes pixel-shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-2px, -3px); }
      40% { transform: translate(2px, 2px); }
      60% { transform: translate(-2px, 1px); }
      80% { transform: translate(2px, -2px); }
    }
    @keyframes prop-furious {
      0% { transform: scaleY(1); }
      25% { transform: scaleY(0.2); }
      50% { transform: scaleY(-1); }
      75% { transform: scaleY(-0.2); }
      100% { transform: scaleY(1); }
    }
    @keyframes bubble-violent-1 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-210px, -40px); opacity: 0; }
    }
    @keyframes bubble-violent-2 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-240px, 20px); opacity: 0; }
    }
    @keyframes alarm-strobe {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.1; }
    }

    .sub-pixel-group { transform-origin: 400px 190px; animation: pixel-shake 0.8s steps(5) infinite; }
    .pixel-propeller { transform-origin: 98px 195px; animation: prop-furious 0.2s steps(4) infinite; }
    .bubble-fast-1 { animation: bubble-violent-1 1s steps(8) infinite; }
    .bubble-fast-2 { animation: bubble-violent-2 1.2s steps(8) infinite; animation-delay: 0.4s; }
    .alarm-light { animation: alarm-strobe 0.4s steps(2) infinite; }
  ]]></style>

  <!-- RED ALERT OCEAN (Full View y=0 to y=400) -->
  <rect x="0" y="0" width="800" height="50" fill="#2d0505" />
  <rect x="0" y="50" width="800" height="60" fill="#450a0a" />
  <rect x="0" y="110" width="800" height="70" fill="#7f1d1d" />
  <rect x="0" y="180" width="800" height="80" fill="#991b1b" />
  <rect x="0" y="260" width="800" height="60" fill="#7f1d1d" />
  <rect x="0" y="320" width="800" height="45" fill="#450a0a" />
  <rect x="0" y="365" width="800" height="35" fill="#2d0505" />

  <!-- Dither Transition Stripes -->
  <rect x="0" y="46" width="800" height="8" fill="url(#dither-2)" />
  <rect x="0" y="106" width="800" height="8" fill="url(#dither-2)" />
  <rect x="0" y="176" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="256" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="316" width="800" height="8" fill="url(#dither-2)" />

  <!-- PIXEL SEABED (Volcanic Black Sand and Basalt Rocks) -->
  <rect x="0" y="368" width="800" height="32" fill="#1c0404" />
  <rect x="0" y="374" width="800" height="26" fill="#140202" />
  <rect x="0" y="386" width="800" height="14" fill="#080000" />
  <g fill="#ef4444">
    <rect x="60" y="372" width="6" height="2" /><rect x="220" y="374" width="8" height="2" fill="#f97316" />
    <rect x="400" y="372" width="6" height="2" /><rect x="620" y="376" width="8" height="2" fill="#f97316" />
  </g>

  <!-- Volcanic Seabed Rocks -->
  <g fill="#330808">
    <rect x="80" y="356" width="36" height="14" /><rect x="86" y="348" width="24" height="8" />
    <rect x="650" y="350" width="46" height="20" /><rect x="660" y="342" width="28" height="8" />
  </g>

  <!-- 16-BIT TYPHOON SUBMARINE (RED ALERT OVERDRIVE) -->
  <g class="sub-pixel-group">
    <!-- Cavitation Bubbles Wake (Violent White and Orange Pixels) -->
    <g class="bubble-fast-1">
      <rect x="78" y="191" width="5" height="5" fill="#fef08a" />
      <rect x="64" y="195" width="7" height="7" fill="#f97316" />
    </g>
    <g class="bubble-fast-2">
      <rect x="72" y="188" width="6" height="6" fill="#ffffff" />
      <rect x="56" y="196" width="9" height="9" fill="#ef4444" />
    </g>

    <!-- PROPELLER (Directly attached to stern at x=98, Glowing with Friction) -->
    <g class="pixel-propeller">
      <rect x="94" y="172" width="6" height="46" fill="#f97316" />
      <rect x="90" y="182" width="14" height="26" fill="#dc2626" />
      <rect x="88" y="190" width="18" height="10" fill="#fef08a" />
    </g>

    <!-- Propeller Hub and Shaft -->
    <rect x="98" y="191" width="10" height="8" fill="#991b1b" />
    <rect x="100" y="189" width="8" height="12" fill="#450a0a" />

    <!-- Tapered Stern Transition -->
    <rect x="106" y="182" width="12" height="13" fill="#2d1212" />
    <rect x="118" y="170" width="14" height="25" fill="#2d1212" />
    <rect x="132" y="158" width="16" height="37" fill="#2d1212" />
    <rect x="148" y="150" width="14" height="45" fill="#2d1212" />
    <!-- Lower Stern Taper (Molten Red Oxide) -->
    <rect x="106" y="195" width="12" height="12" fill="#dc2626" />
    <rect x="118" y="195" width="14" height="24" fill="#dc2626" />
    <rect x="132" y="195" width="16" height="34" fill="#dc2626" />
    <rect x="148" y="195" width="14" height="42" fill="#dc2626" />

    <!-- Aft Tail Fins -->
    <rect x="126" y="112" width="22" height="48" fill="#451a1a" />
    <rect x="116" y="112" width="10" height="18" fill="#2d1212" />
    <rect x="148" y="112" width="6" height="48" fill="#7f1d1d" />
    <rect x="126" y="228" width="22" height="44" fill="#dc2626" />
    <rect x="116" y="254" width="10" height="18" fill="#991b1b" />
    <rect x="148" y="228" width="6" height="44" fill="#ef4444" />

    <!-- MAIN HULL BODY (Overheated Carbon and Steel) -->
    <rect x="162" y="146" width="520" height="49" fill="#2d1212" />
    <rect x="170" y="140" width="495" height="6" fill="#451a1a" />
    <rect x="190" y="136" width="455" height="4" fill="#5c2020" />
    <rect x="220" y="132" width="405" height="4" fill="#7f1d1d" />

    <!-- Lower Hull (Glowing Red) -->
    <rect x="162" y="195" width="520" height="45" fill="#dc2626" />
    <rect x="170" y="240" width="495" height="6" fill="#b91c1c" />
    <rect x="190" y="246" width="455" height="4" fill="#7f1d1d" />
    <rect x="220" y="250" width="405" height="4" fill="#450a0a" />

    <!-- Waterline Seam with Thermal Heat Line -->
    <rect x="106" y="193" width="576" height="4" fill="#180202" />
    <rect x="106" y="195" width="576" height="2" fill="#facc15" opacity="0.8" />

    <!-- Rounded Bow Section -->
    <rect x="682" y="152" width="16" height="43" fill="#2d1212" />
    <rect x="698" y="160" width="14" height="35" fill="#2d1212" />
    <rect x="712" y="172" width="12" height="23" fill="#2d1212" />
    <rect x="724" y="184" width="8" height="11" fill="#ef4444" />
    <rect x="682" y="195" width="16" height="39" fill="#dc2626" />
    <rect x="698" y="195" width="14" height="31" fill="#dc2626" />
    <rect x="712" y="195" width="12" height="19" fill="#b91c1c" />
    <rect x="724" y="195" width="8" height="8" fill="#ef4444" />

    <!-- Torpedo Tube Openings -->
    <g fill="#180202">
      <rect x="690" y="172" width="12" height="4" /><rect x="690" y="180" width="12" height="4" />
      <rect x="690" y="202" width="12" height="4" /><rect x="690" y="210" width="12" height="4" />
    </g>

    <!-- VLS Silo Hatches -->
    <g fill="#140606">
      <rect x="440" y="132" width="10" height="4" /><rect x="454" y="132" width="10" height="4" />
      <rect x="468" y="132" width="10" height="4" /><rect x="482" y="132" width="10" height="4" />
      <rect x="496" y="132" width="10" height="4" /><rect x="510" y="132" width="10" height="4" />
      <rect x="524" y="132" width="10" height="4" /><rect x="538" y="132" width="10" height="4" />
      <rect x="552" y="132" width="10" height="4" /><rect x="566" y="132" width="10" height="4" />
    </g>

    <!-- CONNING TOWER / SAIL (With Strobe Alert Light and Overdrive Captain) -->
    <g>
      <rect x="315" y="80" width="80" height="52" fill="#2d1212" />
      <rect x="325" y="74" width="60" height="6" fill="#451a1a" />
      <rect x="385" y="86" width="20" height="46" fill="#2d1212" />
      <rect x="395" y="96" width="15" height="36" fill="#2d1212" />

      <!-- Red Alert Glow Windows -->
      <rect x="378" y="84" width="6" height="4" fill="#ff1e1e" />
      <rect x="386" y="84" width="6" height="4" fill="#ff1e1e" />
      <rect x="394" y="84" width="6" height="4" fill="#ff1e1e" />

      <!-- Sensor Masts with Flashing Red Strobe Alarm Light -->
      <rect x="335" y="52" width="4" height="22" fill="#140606" />
      <rect x="345" y="40" width="4" height="34" fill="#2d1212" />
      <rect x="343" y="38" width="8" height="4" fill="#facc15" />
      <rect x="360" y="48" width="4" height="26" fill="#140606" />
      <!-- Strobe Light -->
      <rect x="358" y="42" width="8" height="6" fill="#ff0000" class="alarm-light" />

      <!-- OVERDRIVE CAPTAIN WITH HEADBAND (HACHIMAKI) and SWEAT DROP -->
      <g transform="translate(366, 60)">
        <rect x="0" y="0" width="14" height="4" fill="#020617" />
        <rect x="2" y="-2" width="10" height="3" fill="#ffffff" />
        <!-- Red Headband tied over brow -->
        <rect x="-2" y="2" width="18" height="3" fill="#dc2626" />
        <rect x="-4" y="4" width="3" height="4" fill="#dc2626" /> <!-- Band knot trail -->
        <!-- Face -->
        <rect x="2" y="5" width="10" height="5" fill="#fed7aa" />
        <!-- Anime Style Sweat Drop on Temple -->
        <rect x="11" y="2" width="3" height="4" fill="#38bdf8" />
        <rect x="12" y="1" width="1" height="2" fill="#ffffff" />
        <!-- Determinated Eyes -->
        <rect x="8" y="6" width="4" height="2" fill="#000000" />
        <!-- Coat -->
        <rect x="0" y="10" width="14" height="6" fill="#180404" />
      </g>

      <!-- Glowing Red Star -->
      <g transform="translate(345, 96)">
        <rect x="3" y="0" width="3" height="1" fill="#ff0000" />
        <rect x="1" y="1" width="7" height="2" fill="#ff0000" />
        <rect x="0" y="3" width="9" height="2" fill="#ff0000" />
        <rect x="2" y="5" width="5" height="2" fill="#ff0000" />
        <rect x="1" y="7" width="2" height="2" fill="#ff0000" />
        <rect x="6" y="7" width="2" height="2" fill="#ff0000" />
      </g>

      <text x="325" y="122" font-family="ui-monospace, monospace" font-weight="bold" font-size="8" fill="#fca5a5">TK-208</text>
    </g>

    <!-- Anechoic Hull Panels -->
    <g fill="#180202">
      <rect x="230" y="146" width="2" height="94" /><rect x="305" y="146" width="2" height="94" />
      <rect x="430" y="146" width="2" height="94" /><rect x="510" y="146" width="2" height="94" />
      <rect x="590" y="146" width="2" height="94" />
    </g>
  </g>

  <!-- TOP-LEFT BADGE (Generous width 280px, perfectly contained) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="34" fill="#180202" stroke="#ef4444" stroke-width="2" />
    <rect x="2" y="2" width="276" height="30" fill="#2d0505" />
    <text x="140" y="15" text-anchor="middle" class="px-title">RED OCTOBER // TYPHOON</text>
    <text x="140" y="27" text-anchor="middle" class="px-sub">STATUS: <tspan class="px-yellow">RED ALERT (BURNOUT)</tspan></text>
  </g>

  <!-- BOTTOM-LEFT COMMIT STATUS BOX (Generous width 360px, text 100% inside) -->
  <g transform="translate(20, 345)">
    <rect x="0" y="0" width="360" height="32" fill="#180202" stroke="#ef4444" stroke-width="2" />
    <rect x="2" y="2" width="356" height="28" fill="#2d0505" />
    <circle cx="16" cy="16" r="4" fill="#ef4444" class="alarm-light" />
    <text x="30" y="20" class="px-text" font-size="10px">COMMITS: <tspan class="px-yellow">OVERDRIVE</tspan> [15+ COMMITS IN 24H]</text>
  </g>
</svg>
