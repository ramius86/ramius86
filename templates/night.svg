<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Dither Patterns for Night Horizon -->
    <pattern id="dither-night" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#08142b" />
      <rect x="2" y="2" width="2" height="2" fill="#08142b" />
    </pattern>
    <pattern id="searchlight-px" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#fef08a" opacity="0.4" />
      <rect x="2" y="2" width="2" height="2" fill="#fde047" opacity="0.2" />
    </pattern>
  </defs>

  <style><![CDATA[
    /* Chiptune Typography */
    .px-text { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #fde047; letter-spacing: 1px; }
    .px-title { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #facc15; letter-spacing: 1.5px; }
    .px-sub { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: bold; font-size: 9px; fill: #38bdf8; }
    .px-gold { fill: #fef08a; }
    .px-white { fill: #ffffff; }

    /* Keyframe Animations */
    @keyframes surface-bob {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-4px); }
      50% { transform: translateY(0px); }
      75% { transform: translateY(4px); }
    }
    @keyframes prop-spin {
      0% { transform: scaleY(1); }
      25% { transform: scaleY(0.25); }
      50% { transform: scaleY(-1); }
      75% { transform: scaleY(-0.25); }
      100% { transform: scaleY(1); }
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes wave-step {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40px); }
    }
    @keyframes light-sweep {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    .sub-pixel-group { transform-origin: 400px 180px; animation: surface-bob 3.2s steps(4) infinite; }
    .pixel-propeller { transform-origin: 98px 195px; animation: prop-spin 0.6s steps(4) infinite; }
    .star-px { animation: star-twinkle steps(2) infinite; }
    .surface-wave { animation: wave-step 2s steps(8) infinite; }
    .searchlight-cone { transform-origin: 395px 84px; animation: light-sweep 4s steps(6) infinite ease-in-out; }
  ]]></style>

  <!-- NIGHT SKY (Top Half y=0 to y=155) -->
  <rect x="0" y="0" width="800" height="40" fill="#020713" />
  <rect x="0" y="40" width="800" height="45" fill="#050e1f" />
  <rect x="0" y="85" width="800" height="45" fill="#08142b" />
  <rect x="0" y="130" width="800" height="28" fill="#0a1a36" />

  <!-- Pixel Stars -->
  <g fill="#ffffff">
    <rect x="75" y="30" width="3" height="3" class="star-px" style="animation-duration: 2.2s;" />
    <rect x="140" y="60" width="2" height="2" class="star-px" style="animation-duration: 3.5s;" />
    <rect x="230" y="25" width="3" height="3" class="star-px" style="animation-duration: 1.8s;" />
    <rect x="290" y="70" width="2" height="2" class="star-px" style="animation-duration: 2.8s;" />
    <rect x="470" y="40" width="3" height="3" class="star-px" style="animation-duration: 3.0s;" />
    <rect x="560" y="20" width="2" height="2" class="star-px" style="animation-duration: 2.5s;" />
    <rect x="640" y="55" width="3" height="3" class="star-px" style="animation-duration: 1.9s;" />
    <rect x="720" y="35" width="2" height="2" class="star-px" style="animation-duration: 3.2s;" />
  </g>

  <!-- 16-BIT PIXEL FULL MOON (With Stepped Rim and Craters) -->
  <g transform="translate(180, 25)">
    <!-- Moon Body -->
    <rect x="8" y="0" width="24" height="40" fill="#fef9c3" />
    <rect x="4" y="4" width="32" height="32" fill="#fef9c3" />
    <rect x="0" y="8" width="40" height="24" fill="#fef9c3" />
    <!-- Craters -->
    <rect x="8" y="8" width="8" height="6" fill="#fde047" />
    <rect x="12" y="14" width="4" height="4" fill="#facc15" />
    <rect x="24" y="20" width="8" height="8" fill="#fde047" />
    <rect x="26" y="24" width="4" height="4" fill="#facc15" />
    <rect x="10" y="26" width="6" height="6" fill="#fde047" />
  </g>

  <!-- Moon Reflection Shimmer on Water Surface -->
  <g fill="#fef08a" opacity="0.6">
    <rect x="175" y="156" width="50" height="2" />
    <rect x="185" y="160" width="30" height="2" />
    <rect x="190" y="164" width="20" height="2" />
  </g>

  <!-- NIGHT WATER HORIZON and DEPTHS (Bottom Half y=155 to y=400) -->
  <rect x="0" y="155" width="800" height="30" fill="#040d1e" />
  <rect x="0" y="185" width="800" height="50" fill="#020813" />
  <rect x="0" y="235" width="800" height="65" fill="#01050d" />
  <rect x="0" y="300" width="800" height="60" fill="#010308" />
  <rect x="0" y="360" width="800" height="40" fill="#000204" />

  <!-- Seabed (Midnight Sand) -->
  <rect x="0" y="370" width="800" height="30" fill="#0f172a" />
  <rect x="0" y="376" width="800" height="24" fill="#020617" />
  <g fill="#334155">
    <rect x="80" y="360" width="36" height="14" /><rect x="640" y="356" width="44" height="18" />
  </g>

  <!-- 16-BIT TYPHOON SUBMARINE SURFACED (NIGHT RUN) -->
  <g class="sub-pixel-group">
    <!-- SEARCHLIGHT CONE FROM BRIDGE SCANNING THE FORWARD WAVES -->
    <g class="searchlight-cone">
      <polygon points="396,82 780,105 780,165 396,86" fill="url(#searchlight-px)" />
      <rect x="394" y="80" width="4" height="6" fill="#ffffff" />
    </g>

    <!-- Propeller (Directly attached to stern at x=98) -->
    <g class="pixel-propeller">
      <rect x="94" y="172" width="6" height="46" fill="#eab308" />
      <rect x="90" y="182" width="14" height="26" fill="#ca8a04" />
      <rect x="88" y="190" width="18" height="10" fill="#fef08a" />
    </g>

    <!-- Propeller Hub and Shaft -->
    <rect x="98" y="191" width="10" height="8" fill="#a16207" />
    <rect x="100" y="189" width="8" height="12" fill="#713f12" />

    <!-- Tapered Stern Transition -->
    <rect x="106" y="182" width="12" height="13" fill="#1e293b" />
    <rect x="118" y="170" width="14" height="25" fill="#1e293b" />
    <rect x="132" y="158" width="16" height="37" fill="#1e293b" />
    <rect x="148" y="150" width="14" height="45" fill="#1e293b" />
    <!-- Lower Stern Taper (Midnight Red Oxide) -->
    <rect x="106" y="195" width="12" height="12" fill="#7f1d1d" />
    <rect x="118" y="195" width="14" height="24" fill="#7f1d1d" />
    <rect x="132" y="195" width="16" height="34" fill="#7f1d1d" />
    <rect x="148" y="195" width="14" height="42" fill="#7f1d1d" />

    <!-- Aft Tail Fins -->
    <rect x="126" y="112" width="22" height="48" fill="#334155" />
    <rect x="116" y="112" width="10" height="18" fill="#1e293b" />
    <rect x="148" y="112" width="6" height="48" fill="#475569" />
    <rect x="126" y="228" width="22" height="44" fill="#7f1d1d" />
    <rect x="116" y="254" width="10" height="18" fill="#450a0a" />
    <rect x="148" y="228" width="6" height="44" fill="#991b1b" />

    <!-- MAIN HULL BODY -->
    <rect x="162" y="146" width="520" height="49" fill="#1e293b" />
    <rect x="170" y="140" width="495" height="6" fill="#334155" />
    <rect x="190" y="136" width="455" height="4" fill="#475569" />
    <rect x="220" y="132" width="405" height="4" fill="#64748b" />

    <!-- Lower Submerged Hull -->
    <rect x="162" y="195" width="520" height="45" fill="#7f1d1d" />
    <rect x="170" y="240" width="495" height="6" fill="#450a0a" />
    <rect x="190" y="246" width="455" height="4" fill="#1f0303" />
    <rect x="220" y="250" width="405" height="4" fill="#0a0101" />

    <!-- Waterline Seam with White Foam Breaking -->
    <rect x="106" y="193" width="576" height="4" fill="#020617" />
    <rect x="106" y="195" width="576" height="2" fill="#ffffff" opacity="0.8" />

    <!-- Rounded Bow Section -->
    <rect x="682" y="152" width="16" height="43" fill="#1e293b" />
    <rect x="698" y="160" width="14" height="35" fill="#1e293b" />
    <rect x="712" y="172" width="12" height="23" fill="#1e293b" />
    <rect x="724" y="184" width="8" height="11" fill="#0284c7" />
    <rect x="682" y="195" width="16" height="39" fill="#7f1d1d" />
    <rect x="698" y="195" width="14" height="31" fill="#7f1d1d" />
    <rect x="712" y="195" width="12" height="19" fill="#450a0a" />
    <rect x="724" y="195" width="8" height="8" fill="#0284c7" />

    <!-- Torpedo Tube Openings -->
    <g fill="#020617">
      <rect x="690" y="172" width="12" height="4" /><rect x="690" y="180" width="12" height="4" />
      <rect x="690" y="202" width="12" height="4" /><rect x="690" y="210" width="12" height="4" />
    </g>

    <!-- Bow White Wave Foam -->
    <g fill="#ffffff">
      <rect x="728" y="186" width="8" height="6" />
      <rect x="736" y="190" width="10" height="4" />
      <rect x="742" y="192" width="6" height="2" />
    </g>

    <!-- VLS Silo Hatches -->
    <g fill="#0f172a">
      <rect x="440" y="132" width="10" height="4" /><rect x="454" y="132" width="10" height="4" />
      <rect x="468" y="132" width="10" height="4" /><rect x="482" y="132" width="10" height="4" />
      <rect x="496" y="132" width="10" height="4" /><rect x="510" y="132" width="10" height="4" />
      <rect x="524" y="132" width="10" height="4" /><rect x="538" y="132" width="10" height="4" />
      <rect x="552" y="132" width="10" height="4" /><rect x="566" y="132" width="10" height="4" />
    </g>

    <!-- CONNING TOWER / SAIL -->
    <g>
      <rect x="315" y="80" width="80" height="52" fill="#1e293b" />
      <rect x="325" y="74" width="60" height="6" fill="#334155" />
      <rect x="385" y="86" width="20" height="46" fill="#1e293b" />
      <rect x="395" y="96" width="15" height="36" fill="#1e293b" />

      <!-- Warm Golden Windows -->
      <rect x="378" y="84" width="6" height="4" fill="#fef08a" />
      <rect x="386" y="84" width="6" height="4" fill="#fef08a" />
      <rect x="394" y="84" width="6" height="4" fill="#fef08a" />

      <!-- Periscopes and Masts -->
      <rect x="335" y="52" width="4" height="22" fill="#0f172a" />
      <rect x="345" y="40" width="4" height="34" fill="#334155" />
      <rect x="343" y="38" width="8" height="4" fill="#facc15" />
      <rect x="360" y="48" width="4" height="26" fill="#0f172a" />
      <rect x="358" y="44" width="8" height="4" fill="#ef4444" /> <!-- Red Night Mast Light -->

      <!-- CAPTAIN WITH NIGHT BINOCULARS OBSERVING STARS -->
      <g transform="translate(366, 60)">
        <rect x="0" y="0" width="14" height="4" fill="#020617" />
        <rect x="2" y="-2" width="10" height="3" fill="#ffffff" />
        <rect x="-2" y="2" width="18" height="2" fill="#ca8a04" />
        <rect x="2" y="4" width="10" height="6" fill="#fed7aa" />
        <!-- Big Night Binoculars -->
        <rect x="8" y="4" width="8" height="4" fill="#1e293b" />
        <rect x="14" y="4" width="3" height="4" fill="#fef08a" />
        <rect x="0" y="10" width="14" height="6" fill="#020617" />
      </g>

      <!-- Red Star -->
      <g transform="translate(345, 96)">
        <rect x="3" y="0" width="3" height="1" fill="#dc2626" />
        <rect x="1" y="1" width="7" height="2" fill="#dc2626" />
        <rect x="0" y="3" width="9" height="2" fill="#dc2626" />
        <rect x="2" y="5" width="5" height="2" fill="#dc2626" />
        <rect x="1" y="7" width="2" height="2" fill="#dc2626" />
        <rect x="6" y="7" width="2" height="2" fill="#dc2626" />
      </g>

      <text x="325" y="122" font-family="ui-monospace, monospace" font-weight="bold" font-size="8" fill="#fde047">TK-208</text>
    </g>

    <!-- Anechoic Hull Panels -->
    <g fill="#020617">
      <rect x="230" y="146" width="2" height="94" /><rect x="305" y="146" width="2" height="94" />
      <rect x="430" y="146" width="2" height="94" /><rect x="510" y="146" width="2" height="94" />
      <rect x="590" y="146" width="2" height="94" />
    </g>
  </g>

  <!-- TOP-LEFT BADGE (Generous width 280px, perfectly contained) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="34" fill="#020713" stroke="#facc15" stroke-width="2" />
    <rect x="2" y="2" width="276" height="30" fill="#08142b" />
    <text x="140" y="15" text-anchor="middle" class="px-title">RED OCTOBER // TYPHOON</text>
    <text x="140" y="27" text-anchor="middle" class="px-sub">STATUS: <tspan class="px-gold">NIGHT SURFACE</tspan></text>
  </g>

  <!-- BOTTOM-LEFT COMMIT STATUS BOX (Generous width 360px, text 100% inside) -->
  <g transform="translate(20, 345)">
    <rect x="0" y="0" width="360" height="32" fill="#020713" stroke="#facc15" stroke-width="2" />
    <rect x="2" y="2" width="356" height="28" fill="#08142b" />
    <circle cx="16" cy="16" r="4" fill="#facc15" />
    <text x="30" y="20" class="px-text" font-size="10px">COMMITS: <tspan class="px-gold">LATE SHIFT</tspan> [22:00-03:00 UTC]</text>
  </g>
</svg>
