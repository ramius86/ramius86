<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Dither Patterns for Abyssal Night -->
    <pattern id="dither-1" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#1e1b4b" />
      <rect x="2" y="2" width="2" height="2" fill="#1e1b4b" />
    </pattern>
    <pattern id="dither-2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#0f172a" />
      <rect x="2" y="2" width="2" height="2" fill="#0f172a" />
    </pattern>
  </defs>

  <style><![CDATA[
    /* Chiptune Typography */
    .px-text { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #a5b4fc; letter-spacing: 1px; }
    .px-title { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #818cf8; letter-spacing: 1.5px; }
    .px-sub { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: bold; font-size: 9px; fill: #6366f1; }
    .px-cyan { fill: #2dd4bf; }
    .px-pink { fill: #f472b6; }
    .px-white { fill: #ffffff; }

    /* Keyframe Animations */
    @keyframes pixel-bob {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-3px); }
      50% { transform: translateY(0px); }
      75% { transform: translateY(3px); }
    }
    @keyframes prop-slow {
      0% { transform: scaleY(1); }
      25% { transform: scaleY(0.25); }
      50% { transform: scaleY(-1); }
      75% { transform: scaleY(-0.25); }
      100% { transform: scaleY(1); }
    }
    @keyframes jelly-rise-1 {
      0% { transform: translate(170px, 420px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(140px, -60px); opacity: 0; }
    }
    @keyframes jelly-rise-2 {
      0% { transform: translate(620px, 430px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(650px, -50px); opacity: 0; }
    }
    @keyframes note-rise {
      0% { transform: translate(380px, 70px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translate(430px, -15px); opacity: 0; }
    }
    @keyframes coffee-steam {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-4px); opacity: 0.8; }
    }
    @keyframes caterpillar-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    .sub-pixel-group { transform-origin: 400px 190px; animation: pixel-bob 3.6s steps(4) infinite; }
    .pixel-propeller { transform-origin: 98px 195px; animation: prop-slow 1.4s steps(4) infinite; }
    .jelly-1 { animation: jelly-rise-1 14s steps(20) infinite; }
    .jelly-2 { animation: jelly-rise-2 18s steps(24) infinite; animation-delay: 5s; }
    .music-note { animation: note-rise 6s steps(10) infinite; }
    .steam { animation: coffee-steam 1.4s steps(3) infinite; }
    .caterpillar-glow { animation: caterpillar-glow 2.5s steps(3) infinite; }
  ]]></style>

  <!-- ABYSSAL DEEP NIGHT OCEAN (Full View y=0 to y=400) -->
  <rect x="0" y="0" width="800" height="50" fill="#03071e" />
  <rect x="0" y="50" width="800" height="60" fill="#080d28" />
  <rect x="0" y="110" width="800" height="70" fill="#0f172a" />
  <rect x="0" y="180" width="800" height="80" fill="#1e1b4b" />
  <rect x="0" y="260" width="800" height="60" fill="#0f172a" />
  <rect x="0" y="320" width="800" height="45" fill="#080d28" />
  <rect x="0" y="365" width="800" height="35" fill="#03071e" />

  <!-- Dither Transition Stripes -->
  <rect x="0" y="46" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="106" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="176" width="800" height="8" fill="url(#dither-2)" />
  <rect x="0" y="256" width="800" height="8" fill="url(#dither-2)" />
  <rect x="0" y="316" width="800" height="8" fill="url(#dither-1)" />

  <!-- Bioluminescent Plankton Flecks -->
  <g fill="#818cf8">
    <rect x="130" y="80" width="2" height="2" /><rect x="250" y="130" width="3" height="3" fill="#2dd4bf" />
    <rect x="490" y="90" width="2" height="2" fill="#c084fc" /><rect x="630" y="140" width="3" height="3" fill="#818cf8" />
    <rect x="330" y="330" width="2" height="2" fill="#2dd4bf" /><rect x="710" y="310" width="3" height="3" fill="#c084fc" />
  </g>

  <!-- PIXEL SEABED (Dark Abyssal Sand and Trench Rocks) -->
  <rect x="0" y="368" width="800" height="32" fill="#312e81" />
  <rect x="0" y="374" width="800" height="26" fill="#1e1b4b" />
  <rect x="0" y="386" width="800" height="14" fill="#0f172a" />
  <g fill="#4338ca">
    <rect x="80" y="372" width="6" height="2" /><rect x="240" y="374" width="8" height="2" />
    <rect x="420" y="372" width="6" height="2" /><rect x="640" y="376" width="8" height="2" />
  </g>

  <!-- Deep Ocean Rocks -->
  <g fill="#1e293b">
    <rect x="90" y="356" width="36" height="14" /><rect x="96" y="348" width="24" height="8" fill="#334155" />
    <rect x="640" y="350" width="46" height="20" /><rect x="650" y="342" width="28" height="8" fill="#334155" />
  </g>

  <!-- BIOLUMINESCENT PIXEL JELLYFISH 1 (Pink/Cyan) -->
  <g class="jelly-1">
    <!-- Jelly Bell -->
    <rect x="-10" y="0" width="20" height="8" fill="#f472b6" />
    <rect x="-12" y="8" width="24" height="6" fill="#ec4899" />
    <rect x="-6" y="-4" width="12" height="4" fill="#f472b6" />
    <!-- Inner Core Glow -->
    <rect x="-4" y="2" width="8" height="6" fill="#fbcfe8" />
    <!-- Pixel Tentacles -->
    <g fill="#2dd4bf">
      <rect x="-8" y="14" width="2" height="18" /><rect x="-10" y="22" width="2" height="12" />
      <rect x="-3" y="14" width="2" height="26" fill="#fbcfe8" /><rect x="-1" y="28" width="2" height="16" />
      <rect x="3" y="14" width="2" height="24" fill="#fbcfe8" /><rect x="5" y="24" width="2" height="18" />
      <rect x="8" y="14" width="2" height="16" /><rect x="10" y="20" width="2" height="12" />
    </g>
  </g>

  <!-- BIOLUMINESCENT PIXEL JELLYFISH 2 (Cyan/Violet) -->
  <g class="jelly-2">
    <rect x="-8" y="0" width="16" height="6" fill="#2dd4bf" />
    <rect x="-10" y="6" width="20" height="5" fill="#0d9488" />
    <rect x="-4" y="-3" width="8" height="3" fill="#2dd4bf" />
    <rect x="-3" y="2" width="6" height="4" fill="#ccfbf1" />
    <g fill="#a855f7">
      <rect x="-6" y="11" width="2" height="16" /><rect x="-2" y="11" width="2" height="22" fill="#c084fc" />
      <rect x="2" y="11" width="2" height="20" fill="#c084fc" /><rect x="6" y="11" width="2" height="15" />
    </g>
  </g>

  <!-- FLOATING PIXEL MUSIC NOTE FROM CONNING TOWER -->
  <g class="music-note">
    <rect x="0" y="6" width="6" height="4" fill="#2dd4bf" />
    <rect x="4" y="0" width="2" height="8" fill="#2dd4bf" />
    <rect x="4" y="0" width="5" height="2" fill="#2dd4bf" />
  </g>

  <!-- 16-BIT TYPHOON SUBMARINE (SILENT CATERPILLAR RUNNING) -->
  <g class="sub-pixel-group">
    <!-- Caterpillar Drive MHD Vent Glow on Bottom Keel -->
    <g class="caterpillar-glow">
      <rect x="240" y="248" width="80" height="4" fill="#2dd4bf" />
      <rect x="440" y="248" width="80" height="4" fill="#2dd4bf" />
    </g>

    <!-- PROPELLER (Directly attached to stern hub at x=98) -->
    <g class="pixel-propeller">
      <rect x="94" y="172" width="6" height="46" fill="#92400e" />
      <rect x="90" y="182" width="14" height="26" fill="#78350f" />
      <rect x="88" y="190" width="18" height="10" fill="#b45309" />
    </g>

    <!-- Propeller Hub and Shaft Connection -->
    <rect x="98" y="191" width="10" height="8" fill="#78350f" />
    <rect x="100" y="189" width="8" height="12" fill="#451a03" />

    <!-- Tapered Stern Transition -->
    <rect x="106" y="182" width="12" height="13" fill="#1e293b" />
    <rect x="118" y="170" width="14" height="25" fill="#1e293b" />
    <rect x="132" y="158" width="16" height="37" fill="#1e293b" />
    <rect x="148" y="150" width="14" height="45" fill="#1e293b" />
    <!-- Lower Stern Taper (Deep Plum Red) -->
    <rect x="106" y="195" width="12" height="12" fill="#701a75" />
    <rect x="118" y="195" width="14" height="24" fill="#701a75" />
    <rect x="132" y="195" width="16" height="34" fill="#701a75" />
    <rect x="148" y="195" width="14" height="42" fill="#701a75" />

    <!-- Aft Cruciform Tail Fins -->
    <rect x="126" y="112" width="22" height="48" fill="#1e293b" />
    <rect x="116" y="112" width="10" height="18" fill="#0f172a" />
    <rect x="148" y="112" width="6" height="48" fill="#334155" />
    <rect x="126" y="228" width="22" height="44" fill="#701a75" />
    <rect x="116" y="254" width="10" height="18" fill="#4a044e" />
    <rect x="148" y="228" width="6" height="44" fill="#86198f" />

    <!-- MAIN HULL BODY -->
    <rect x="162" y="146" width="520" height="49" fill="#1e293b" />
    <rect x="170" y="140" width="495" height="6" fill="#334155" />
    <rect x="190" y="136" width="455" height="4" fill="#475569" />
    <rect x="220" y="132" width="405" height="4" fill="#64748b" />

    <!-- Lower Hull (Night Wine Plum) -->
    <rect x="162" y="195" width="520" height="45" fill="#701a75" />
    <rect x="170" y="240" width="495" height="6" fill="#581c87" />
    <rect x="190" y="246" width="455" height="4" fill="#3b0764" />
    <rect x="220" y="250" width="405" height="4" fill="#1e1b4b" />

    <!-- Waterline Boundary Line -->
    <rect x="106" y="193" width="576" height="4" fill="#020617" />
    <rect x="106" y="195" width="576" height="2" fill="#6366f1" opacity="0.4" />

    <!-- Rounded Bow Section -->
    <rect x="682" y="152" width="16" height="43" fill="#1e293b" />
    <rect x="698" y="160" width="14" height="35" fill="#1e293b" />
    <rect x="712" y="172" width="12" height="23" fill="#1e293b" />
    <rect x="724" y="184" width="8" height="11" fill="#4338ca" />
    <rect x="682" y="195" width="16" height="39" fill="#701a75" />
    <rect x="698" y="195" width="14" height="31" fill="#701a75" />
    <rect x="712" y="195" width="12" height="19" fill="#581c87" />
    <rect x="724" y="195" width="8" height="8" fill="#4338ca" />

    <!-- Torpedo Tube Openings -->
    <g fill="#020617">
      <rect x="690" y="172" width="12" height="4" /><rect x="690" y="180" width="12" height="4" />
      <rect x="690" y="202" width="12" height="4" /><rect x="690" y="210" width="12" height="4" />
    </g>

    <!-- VLS Silos Hatches -->
    <g fill="#0f172a">
      <rect x="440" y="132" width="10" height="4" /><rect x="454" y="132" width="10" height="4" />
      <rect x="468" y="132" width="10" height="4" /><rect x="482" y="132" width="10" height="4" />
      <rect x="496" y="132" width="10" height="4" /><rect x="510" y="132" width="10" height="4" />
      <rect x="524" y="132" width="10" height="4" /><rect x="538" y="132" width="10" height="4" />
      <rect x="552" y="132" width="10" height="4" /><rect x="566" y="132" width="10" height="4" />
    </g>

    <!-- CONNING TOWER / SAIL (With Chill Captain drinking Coffee) -->
    <g>
      <rect x="315" y="80" width="80" height="52" fill="#1e293b" />
      <rect x="325" y="74" width="60" height="6" fill="#334155" />
      <rect x="385" y="86" width="20" height="46" fill="#1e293b" />
      <rect x="395" y="96" width="15" height="36" fill="#1e293b" />

      <!-- Amber Glow from Command Bridge Window -->
      <rect x="378" y="84" width="6" height="4" fill="#f59e0b" />
      <rect x="386" y="84" width="6" height="4" fill="#f59e0b" />
      <rect x="394" y="84" width="6" height="4" fill="#f59e0b" />

      <!-- Periscopes -->
      <rect x="335" y="52" width="4" height="22" fill="#0f172a" />
      <rect x="345" y="40" width="4" height="34" fill="#334155" />
      <rect x="343" y="38" width="8" height="4" fill="#818cf8" />
      <rect x="360" y="48" width="4" height="26" fill="#0f172a" />

      <!-- CHILL CAPTAIN WITH COFFEE MUG and STEAM -->
      <g transform="translate(366, 60)">
        <rect x="0" y="0" width="14" height="4" fill="#020617" />
        <rect x="2" y="-2" width="10" height="3" fill="#ffffff" />
        <rect x="-2" y="2" width="18" height="2" fill="#ca8a04" />
        <rect x="2" y="4" width="10" height="6" fill="#fed7aa" />
        <!-- Headphone Band over Ears -->
        <rect x="1" y="2" width="12" height="2" fill="#2dd4bf" />
        <rect x="0" y="4" width="3" height="4" fill="#2dd4bf" />
        <!-- Coffee Mug -->
        <rect x="11" y="8" width="5" height="6" fill="#ffffff" />
        <rect x="12" y="7" width="3" height="2" fill="#78350f" /> <!-- Coffee -->
        <rect x="16" y="9" width="2" height="4" fill="#ffffff" />
        <!-- Rising Steam -->
        <g class="steam">
          <rect x="12" y="3" width="2" height="3" fill="#e0e7ff" />
        </g>
        <rect x="0" y="10" width="14" height="6" fill="#020617" />
      </g>

      <!-- Subdued Star Emblem -->
      <g transform="translate(345, 96)">
        <rect x="3" y="0" width="3" height="1" fill="#831843" />
        <rect x="1" y="1" width="7" height="2" fill="#831843" />
        <rect x="0" y="3" width="9" height="2" fill="#831843" />
        <rect x="2" y="5" width="5" height="2" fill="#831843" />
        <rect x="1" y="7" width="2" height="2" fill="#831843" />
        <rect x="6" y="7" width="2" height="2" fill="#831843" />
      </g>

      <text x="325" y="122" font-family="ui-monospace, monospace" font-weight="bold" font-size="8" fill="#64748b">TK-208</text>
    </g>

    <!-- Anechoic Hull Panels -->
    <g fill="#020617">
      <rect x="230" y="146" width="2" height="94" /><rect x="305" y="146" width="2" height="94" />
      <rect x="430" y="146" width="2" height="94" /><rect x="510" y="146" width="2" height="94" />
      <rect x="590" y="146" width="2" height="94" />
    </g>
  </g>

  <!-- TOP-LEFT BADGE (Generous width, perfectly contained) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="34" fill="#020617" stroke="#6366f1" stroke-width="2" />
    <rect x="2" y="2" width="276" height="30" fill="#0b0e24" />
    <text x="140" y="15" text-anchor="middle" class="px-title">RED OCTOBER // TYPHOON</text>
    <text x="140" y="27" text-anchor="middle" class="px-sub">STATUS: <tspan class="px-cyan">SILENT RUNNING</tspan></text>
  </g>

  <!-- BOTTOM-LEFT STATUS BOX (Generous width 350px, text 100% inside) -->
  <g transform="translate(20, 345)">
    <rect x="0" y="0" width="350" height="32" fill="#020617" stroke="#6366f1" stroke-width="2" />
    <rect x="2" y="2" width="346" height="28" fill="#0b0e24" />
    <circle cx="16" cy="16" r="4" fill="#818cf8" />
    <text x="30" y="20" class="px-text" font-size="10px">COMMITS: <tspan class="px-cyan">CHILL</tspan> [NO PUSH &gt; 24H]</text>
  </g>
</svg>
