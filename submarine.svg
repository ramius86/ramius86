<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Dither Patterns for Oceanic Depth -->
    <pattern id="dither-1" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#0369a1" />
      <rect x="2" y="2" width="2" height="2" fill="#0369a1" />
    </pattern>
    <pattern id="dither-2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#0c4a6e" />
      <rect x="2" y="2" width="2" height="2" fill="#0c4a6e" />
    </pattern>
    <linearGradient id="sun-ray-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style><![CDATA[
    /* Chiptune Typography - Crisp and Monospace */
    .px-text { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #facc15; letter-spacing: 1px; }
    .px-title { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: 900; font-size: 11px; fill: #38bdf8; letter-spacing: 1.5px; }
    .px-sub { font-family: ui-monospace, "SF Mono", Monaco, Consolas, "Courier New", monospace; font-weight: bold; font-size: 9px; fill: #94a3b8; }
    .px-cyan { fill: #38bdf8; }
    .px-green { fill: #4ade80; }
    .px-white { fill: #ffffff; }

    /* Pixel Frame-by-Frame Keyframes */
    @keyframes pixel-bob {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-4px); }
      50% { transform: translateY(0px); }
      75% { transform: translateY(4px); }
    }
    @keyframes prop-spin {
      0% { transform: scaleY(1); }
      25% { transform: scaleY(0.25); }
      50% { transform: scaleY(-1); }
      75% { transform: scaleY(-0.25); }
      100% { transform: scaleY(1); }
    }
    @keyframes bubble-drift-1 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-160px, -50px); opacity: 0; }
    }
    @keyframes bubble-drift-2 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-190px, -30px); opacity: 0; }
    }
    @keyframes fish-shoal {
      0% { transform: translateX(840px); }
      100% { transform: translateX(-90px); }
    }
    @keyframes kelp-sway {
      0%, 100% { transform: skewX(-3deg); }
      50% { transform: skewX(3deg); }
    }
    @keyframes beacon-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }
    @keyframes coin-glint {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .sub-pixel-group { transform-origin: 400px 190px; animation: pixel-bob 2.8s steps(4) infinite; }
    .pixel-propeller { transform-origin: 98px 195px; animation: prop-spin 0.4s steps(4) infinite; }
    .bubble-1 { animation: bubble-drift-1 1.8s steps(8) infinite; }
    .bubble-2 { animation: bubble-drift-2 2.2s steps(8) infinite; animation-delay: 0.7s; }
    .fish-school { animation: fish-shoal 14s linear infinite; }
    .seaweed { transform-origin: 500px 380px; animation: kelp-sway 3.2s steps(4) infinite ease-in-out; }
    .mast-beacon { animation: beacon-blink 1.2s steps(2) infinite; }
    .glint { animation: coin-glint 1s steps(2) infinite; }
  ]]></style>

  <!-- 16-BIT OCEAN BACKGROUND (Full Screen y=0 to y=400) -->
  <rect x="0" y="0" width="800" height="50" fill="#075985" />
  <rect x="0" y="50" width="800" height="60" fill="#0369a1" />
  <rect x="0" y="110" width="800" height="70" fill="#0284c7" />
  <rect x="0" y="180" width="800" height="80" fill="#0369a1" />
  <rect x="0" y="260" width="800" height="60" fill="#075985" />
  <rect x="0" y="320" width="800" height="45" fill="#0c4a6e" />
  <rect x="0" y="365" width="800" height="35" fill="#082f49" />

  <!-- Dither Transition Stripes between Ocean Layers -->
  <rect x="0" y="46" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="106" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="176" width="800" height="8" fill="url(#dither-1)" />
  <rect x="0" y="256" width="800" height="8" fill="url(#dither-2)" />
  <rect x="0" y="316" width="800" height="8" fill="url(#dither-2)" />

  <!-- Sunlight Volumetric Rays (Pixel Beams) -->
  <g>
    <polygon points="120,0 200,0 260,260 140,260" fill="url(#sun-ray-grad)" />
    <polygon points="340,0 420,0 500,280 380,280" fill="url(#sun-ray-grad)" />
    <polygon points="560,0 640,0 720,240 610,240" fill="url(#sun-ray-grad)" />
  </g>

  <!-- PIXEL SEABED (Dunes, Rocks, Gold Chest) -->
  <!-- Sand Layers -->
  <rect x="0" y="368" width="800" height="32" fill="#ca8a04" />
  <rect x="0" y="374" width="800" height="26" fill="#a16207" />
  <rect x="0" y="386" width="800" height="14" fill="#713f12" />
  <!-- Pebbles -->
  <g fill="#fef08a">
    <rect x="60" y="372" width="6" height="2" /><rect x="220" y="374" width="8" height="2" />
    <rect x="400" y="372" width="6" height="2" /><rect x="620" y="376" width="8" height="2" />
    <rect x="740" y="372" width="6" height="2" />
  </g>

  <!-- Seabed Rocks -->
  <g fill="#475569">
    <rect x="80" y="356" width="36" height="14" /><rect x="86" y="348" width="24" height="8" />
    <rect x="92" y="344" width="12" height="4" /><rect x="80" y="364" width="36" height="6" fill="#334155" />
    <rect x="650" y="350" width="46" height="20" /><rect x="660" y="342" width="28" height="8" />
    <rect x="650" y="362" width="46" height="8" fill="#334155" />
  </g>

  <!-- Pixel Treasure Chest (Easter Egg on Seabed) -->
  <g transform="translate(670, 342)">
    <rect x="0" y="8" width="22" height="16" fill="#854d0e" />
    <rect x="2" y="10" width="18" height="12" fill="#a16207" />
    <rect x="0" y="4" width="22" height="6" fill="#ca8a04" />
    <rect x="5" y="4" width="2" height="20" fill="#facc15" />
    <rect x="15" y="4" width="2" height="20" fill="#facc15" />
    <rect x="9" y="8" width="4" height="5" fill="#fef08a" />
    <rect x="10" y="2" width="3" height="3" fill="#ffffff" class="glint" />
  </g>

  <!-- Pixel Kelp / Seaweed -->
  <g class="seaweed">
    <rect x="140" y="320" width="6" height="50" fill="#15803d" />
    <rect x="134" y="330" width="6" height="10" fill="#22c55e" /><rect x="146" y="345" width="6" height="10" fill="#22c55e" />
    <rect x="134" y="360" width="6" height="10" fill="#22c55e" />
    <rect x="155" y="335" width="6" height="35" fill="#166534" /><rect x="161" y="345" width="6" height="8" fill="#15803d" />
    <rect x="580" y="315" width="6" height="55" fill="#15803d" /><rect x="574" y="325" width="6" height="12" fill="#22c55e" />
    <rect x="586" y="345" width="6" height="12" fill="#22c55e" />
  </g>

  <!-- Pixel Fish Shoal Swimming Across -->
  <g class="fish-school">
    <!-- Big Clownfish -->
    <g transform="translate(0, 270)">
      <rect x="0" y="2" width="14" height="6" fill="#f97316" />
      <rect x="3" y="0" width="8" height="10" fill="#f97316" />
      <rect x="5" y="0" width="3" height="10" fill="#ffffff" />
      <rect x="14" y="0" width="4" height="10" fill="#ea580c" />
      <rect x="18" y="-2" width="4" height="4" fill="#ea580c" /><rect x="18" y="8" width="4" height="4" fill="#ea580c" />
      <rect x="2" y="2" width="2" height="2" fill="#ffffff" /><rect x="2" y="2" width="1" height="1" fill="#000000" />
    </g>
    <!-- Little Cyan Fish -->
    <g transform="translate(32, 285)">
      <rect x="0" y="1" width="8" height="4" fill="#38bdf8" />
      <rect x="8" y="0" width="3" height="6" fill="#0284c7" />
      <rect x="1" y="1" width="2" height="1" fill="#ffffff" />
    </g>
  </g>

  <!-- 16-BIT TYPHOON SUBMARINE (RED OCTOBER) WITH ATTACHED PROPELLER -->
  <g class="sub-pixel-group">
    <!-- Cavitation Bubbles Wake (Square Pixel Bubbles) -->
    <g class="bubble-1">
      <rect x="80" y="191" width="4" height="4" fill="#ffffff" />
      <rect x="68" y="195" width="6" height="6" fill="#bae6fd" />
    </g>
    <g class="bubble-2">
      <rect x="74" y="189" width="5" height="5" fill="#e0f2fe" />
      <rect x="60" y="197" width="8" height="8" fill="#7dd3fc" />
    </g>

    <!-- PROPELLER (Directly attached to stern hub at x=98) -->
    <g class="pixel-propeller">
      <rect x="94" y="172" width="6" height="46" fill="#eab308" />
      <rect x="90" y="182" width="14" height="26" fill="#ca8a04" />
      <rect x="88" y="190" width="18" height="10" fill="#fef08a" />
    </g>

    <!-- PROPELLER SHAFT AND HUB (Connects Propeller to Stern) -->
    <rect x="98" y="191" width="10" height="8" fill="#a16207" />
    <rect x="100" y="189" width="8" height="12" fill="#713f12" />

    <!-- TAPERED STERN TRANSITION (Solid hull connection between x=106 and x=150) -->
    <!-- Upper Stern Taper -->
    <rect x="106" y="182" width="12" height="13" fill="#1e293b" />
    <rect x="118" y="170" width="14" height="25" fill="#1e293b" />
    <rect x="132" y="158" width="16" height="37" fill="#1e293b" />
    <rect x="148" y="150" width="14" height="45" fill="#1e293b" />
    <!-- Lower Stern Taper (Red Oxide) -->
    <rect x="106" y="195" width="12" height="12" fill="#991b1b" />
    <rect x="118" y="195" width="14" height="24" fill="#991b1b" />
    <rect x="132" y="195" width="16" height="34" fill="#991b1b" />
    <rect x="148" y="195" width="14" height="42" fill="#991b1b" />

    <!-- Aft Cruciform Tail Fins -->
    <!-- Top Fin -->
    <rect x="126" y="112" width="22" height="48" fill="#334155" />
    <rect x="116" y="112" width="10" height="18" fill="#1e293b" />
    <rect x="148" y="112" width="6" height="48" fill="#475569" />
    <!-- Bottom Fin -->
    <rect x="126" y="228" width="22" height="44" fill="#991b1b" />
    <rect x="116" y="254" width="10" height="18" fill="#7f1d1d" />
    <rect x="148" y="228" width="6" height="44" fill="#b91c1c" />

    <!-- MAIN HULL BODY (Double Hull Profile) -->
    <!-- Upper Hull (Titanium Graphite Steel) -->
    <rect x="162" y="146" width="520" height="49" fill="#1e293b" />
    <rect x="170" y="140" width="495" height="6" fill="#334155" />
    <rect x="190" y="136" width="455" height="4" fill="#475569" />
    <rect x="220" y="132" width="405" height="4" fill="#64748b" />

    <!-- Lower Hull (Red Oxide Anti-Fouling Steel) -->
    <rect x="162" y="195" width="520" height="45" fill="#991b1b" />
    <rect x="170" y="240" width="495" height="6" fill="#7f1d1d" />
    <rect x="190" y="246" width="455" height="4" fill="#450a0a" />
    <rect x="220" y="250" width="405" height="4" fill="#1f0303" />

    <!-- Waterline Boundary Line -->
    <rect x="106" y="193" width="576" height="4" fill="#020617" />
    <rect x="106" y="195" width="576" height="2" fill="#38bdf8" opacity="0.5" />

    <!-- Rounded Bow Section -->
    <!-- Upper Bow -->
    <rect x="682" y="152" width="16" height="43" fill="#1e293b" />
    <rect x="698" y="160" width="14" height="35" fill="#1e293b" />
    <rect x="712" y="172" width="12" height="23" fill="#1e293b" />
    <rect x="724" y="184" width="8" height="11" fill="#0284c7" />
    <!-- Lower Bow -->
    <rect x="682" y="195" width="16" height="39" fill="#991b1b" />
    <rect x="698" y="195" width="14" height="31" fill="#991b1b" />
    <rect x="712" y="195" width="12" height="19" fill="#7f1d1d" />
    <rect x="724" y="195" width="8" height="8" fill="#0284c7" />

    <!-- Torpedo Tube Openings -->
    <g fill="#020617">
      <rect x="690" y="172" width="12" height="4" />
      <rect x="690" y="180" width="12" height="4" />
      <rect x="690" y="202" width="12" height="4" />
      <rect x="690" y="210" width="12" height="4" />
    </g>

    <!-- VLS Missile Silo Hatches (Deck Forward of Sail) -->
    <g fill="#0f172a">
      <rect x="440" y="132" width="10" height="4" /><rect x="454" y="132" width="10" height="4" />
      <rect x="468" y="132" width="10" height="4" /><rect x="482" y="132" width="10" height="4" />
      <rect x="496" y="132" width="10" height="4" /><rect x="510" y="132" width="10" height="4" />
      <rect x="524" y="132" width="10" height="4" /><rect x="538" y="132" width="10" height="4" />
      <rect x="552" y="132" width="10" height="4" /><rect x="566" y="132" width="10" height="4" />
    </g>

    <!-- CONNING TOWER / SAIL (With 16-bit Soviet Commander) -->
    <g>
      <rect x="315" y="80" width="80" height="52" fill="#1e293b" />
      <rect x="325" y="74" width="60" height="6" fill="#334155" />
      <rect x="385" y="86" width="20" height="46" fill="#1e293b" />
      <rect x="395" y="96" width="15" height="36" fill="#1e293b" />

      <!-- Bridge Windows (Cyan Glow Pixels) -->
      <rect x="378" y="84" width="6" height="4" fill="#38bdf8" />
      <rect x="386" y="84" width="6" height="4" fill="#38bdf8" />
      <rect x="394" y="84" width="6" height="4" fill="#38bdf8" />

      <!-- Periscopes and Radar Mast -->
      <rect x="335" y="52" width="4" height="22" fill="#475569" />
      <rect x="345" y="40" width="4" height="34" fill="#64748b" />
      <rect x="343" y="38" width="8" height="4" fill="#38bdf8" />
      <rect x="360" y="48" width="4" height="26" fill="#475569" />
      <rect x="358" y="44" width="8" height="4" fill="#4ade80" class="mast-beacon" />

      <!-- 16-BIT SOVIET CAPTAIN ON THE BRIDGE -->
      <g transform="translate(366, 60)">
        <rect x="0" y="0" width="14" height="4" fill="#020617" />
        <rect x="2" y="-2" width="10" height="3" fill="#ffffff" />
        <rect x="5" y="-1" width="3" height="2" fill="#e11d48" />
        <rect x="-2" y="2" width="18" height="2" fill="#ca8a04" />
        <rect x="2" y="4" width="10" height="6" fill="#fed7aa" />
        <rect x="10" y="5" width="5" height="4" fill="#020617" />
        <rect x="14" y="5" width="2" height="4" fill="#38bdf8" />
        <rect x="0" y="10" width="14" height="6" fill="#020617" />
        <rect x="4" y="10" width="6" height="4" fill="#facc15" />
      </g>

      <!-- Red Star on Sail -->
      <g transform="translate(345, 96)">
        <rect x="3" y="0" width="3" height="1" fill="#f43f5e" />
        <rect x="1" y="1" width="7" height="2" fill="#f43f5e" />
        <rect x="0" y="3" width="9" height="2" fill="#f43f5e" />
        <rect x="2" y="5" width="5" height="2" fill="#f43f5e" />
        <rect x="1" y="7" width="2" height="2" fill="#f43f5e" />
        <rect x="6" y="7" width="2" height="2" fill="#f43f5e" />
      </g>

      <text x="325" y="122" font-family="ui-monospace, monospace" font-weight="bold" font-size="8" fill="#94a3b8">TK-208</text>
    </g>

    <!-- Anechoic Hull Panels (Pixel Grid Seams) -->
    <g fill="#020617">
      <rect x="230" y="146" width="2" height="94" />
      <rect x="305" y="146" width="2" height="94" />
      <rect x="430" y="146" width="2" height="94" />
      <rect x="510" y="146" width="2" height="94" />
      <rect x="590" y="146" width="2" height="94" />
    </g>
  </g>

  <!-- TOP-LEFT STATUS BADGE (Carefully calculated padding, perfectly contained) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="34" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <rect x="2" y="2" width="276" height="30" fill="#0b1329" />
    <text x="140" y="15" text-anchor="middle" class="px-title">RED OCTOBER // TYPHOON</text>
    <text x="140" y="27" text-anchor="middle" class="px-sub">STATUS: <tspan class="px-green">ACTIVE PATROL</tspan></text>
  </g>

  <!-- BOTTOM-LEFT COMMIT STATUS BOX (Generous width, text 100% inside) -->
  <g transform="translate(20, 345)">
    <rect x="0" y="0" width="340" height="32" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <rect x="2" y="2" width="336" height="28" fill="#0b1329" />
    <circle cx="16" cy="16" r="4" fill="#4ade80" />
    <text x="30" y="20" class="px-text" font-size="10px">COMMITS: <tspan class="px-green">ACTIVE</tspan> [PUSH &lt; 24H]</text>
  </g>
</svg>
